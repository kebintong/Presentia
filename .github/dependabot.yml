# Dependabot opens a pull request when something we depend on has an update.
# Updates are grouped (one PR per area per month) to keep the noise down, and
# every PR runs the normal checks. Python packages are left alone on purpose:
# requirements.txt is kept by hand.
#
# Major versions of npm and Go packages are ignored: they usually need code
# changes (e.g. @vitejs/plugin-react 6 needs Vite 8), so they are upgraded
# deliberately, not by a bot. GitHub Actions majors are fine: CI tests them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /presentia-desktop/frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      frontend: { patterns: ["*"], update-types: ["minor", "patch"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      website: { patterns: ["*"], update-types: ["minor", "patch"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: /presentia-desktop
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      go: { patterns: ["*"], update-types: ["minor", "patch"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

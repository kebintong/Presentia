# Checks run on every push and pull request. A red X on a commit means
# something below failed; open the "Actions" tab on GitHub to see which step.
# Release only from a commit with a green check (see build/BUILD.md).
name: CI

on:
  push:
    paths-ignore: ["**.md", "Dev Ins.txt"]
  pull_request:
    paths-ignore: ["**.md", "Dev Ins.txt"]
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sidecar:
    name: Sidecar (Python tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # OpenCV and MediaPipe need these system libraries on Linux.
      - name: System libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libgl1 libegl1 libgles2

      # PySide6 is only for the old Qt UI, which the sidecar does not use.
      - name: Install dependencies
        run: |
          grep -v -i '^pyside6' requirements.txt > ci-requirements.txt
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt pytest httpx openpyxl

      - name: Syntax check
        run: python -m compileall -q app tools tests

      - name: Tests
        run: python -m pytest tests -q

  frontend:
    name: Desktop UI (TypeScript build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: presentia-desktop/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: presentia-desktop/frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Type check and build
        run: npm run build

      # The Windows job below embeds this build into the .exe.
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: presentia-desktop/frontend/dist
          retention-days: 3

  desktop:
    name: Desktop app (Windows build)
    runs-on: windows-latest
    needs: frontend
    timeout-minutes: 20
    defaults:
      run:
        working-directory: presentia-desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: presentia-desktop/frontend/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: presentia-desktop/go.mod
          cache-dependency-path: presentia-desktop/go.sum

      # Same Go build that "wails build" runs, without packaging. Catches
      # compile errors in app.go, the bubble, the tray and the updater.
      - name: Build
        run: go build -tags desktop,production -ldflags "-H windowsgui" -o build/bin/Presentia-ci.exe .

  website:
    name: Registration website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: |
          node --check src/worker.js
          for f in public/*.js; do node --check "$f"; done

      # Bundles the Worker exactly as a deploy would, without uploading
      # anything (no Cloudflare account needed).
      - name: Deploy dry run
        run: |
          npm run assets
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
